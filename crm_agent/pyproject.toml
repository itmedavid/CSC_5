[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crm_agent"
version = "0.1.0"
description = "Local-first CRM onboarding assistant for GuideCX-ready notes."
requires-python = ">=3.10"
dependencies = [
  "streamlit>=1.32",
  "anthropic>=0.40",
  "openai>=1.40",
  "rapidfuzz>=3.6",
  "phonenumbers>=8.13",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.4",
  "black>=24.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["crm_agent*", "db*", "parser*", "matcher*", "llm*", "formatter*", "ui*", "exporters*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.pytest.ini_options]
testpaths = ["tests"]
